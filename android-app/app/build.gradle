plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'com.google.gms.google-services'
}

android {
    namespace 'com.examsystem.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.examsystem.app"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
        // Google test rewarded unit — replace with your AdMob rewarded unit ID for production
        buildConfigField "String", "ADMOB_REWARDED_UNIT_ID", "\"ca-app-pub-3940256099942544/5224354917\""
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }

    buildFeatures {
        compose true
        buildConfig true
    }

    composeOptions {
        kotlinCompilerExtensionVersion '1.5.1'
    }
}

dependencies {
    // Jetpack Compose BOM
    implementation platform('androidx.compose:compose-bom:2023.09.00')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-extended'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.activity:activity-compose:1.8.0'
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.6.2'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.6.2'
    
    // Material Components for XML themes (required for themes.xml)
    implementation 'com.google.android.material:material:1.11.0'

    // Navigation
    implementation 'androidx.navigation:navigation-compose:2.7.3'

    // Firebase BOM
    implementation platform('com.google.firebase:firebase-bom:33.0.0')
    implementation 'com.google.firebase:firebase-auth-ktx'
    implementation 'com.google.firebase:firebase-firestore-ktx'
    implementation 'com.google.firebase:firebase-storage-ktx'
    implementation 'com.google.firebase:firebase-functions-ktx'

    // Coroutines
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-play-services:1.7.3'

    // Coil for Image Loading
    implementation("io.coil-kt:coil-compose:2.4.0")

    debugImplementation 'androidx.compose.ui:ui-tooling'
    implementation 'commons-codec:commons-codec:1.16.0'

    // Local JVM unit tests (no emulator needed)
    testImplementation 'junit:junit:4.13.2'

    // PDF Extraction
    implementation 'com.tom-roush:pdfbox-android:2.0.27.0'

    // Google Mobile Ads (AdMob)
    implementation 'com.google.android.gms:play-services-ads:23.0.0'

    // Camera (optional exam proctoring)
    def camerax = "1.3.1"
    implementation "androidx.camera:camera-camera2:$camerax"
    implementation "androidx.camera:camera-lifecycle:$camerax"
    implementation "androidx.camera:camera-view:$camerax"
    implementation "com.google.guava:guava:31.1-android"
}
