name: exam_system_flutter
description: "Cross-platform Flutter application for Online MCQ Examination Platform"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Firebase SDKs
  firebase_core: ^3.10.0
  firebase_auth: ^5.4.1
  cloud_firestore: ^5.6.1
  firebase_storage: ^12.4.1

  # State Management & Routing
  flutter_riverpod: ^2.6.1
  go_router: ^14.8.0

  # UI Components & Styling
  google_fonts: ^6.2.1
  lucide_icons: ^0.257.0
  intl: ^0.20.2
  fl_chart: ^0.70.1
  http: ^1.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
